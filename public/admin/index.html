<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manoel Taylor | Admin</title>
    <style>
      /* Custom branding for the CMS panel */
      [data-slate-editor] { font-family: 'Inter', sans-serif !important; }
    </style>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // ─── Preview Templates ───────────────────────────────
      // These render a styled preview inside the CMS editor

      // Blog Preview
      var BlogPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var imageUrl = entry.getIn(['data', 'imageUrl']);
          return h('div', { style: {
            fontFamily: 'Inter, sans-serif',
            backgroundColor: '#0a0a0a',
            color: '#fff',
            padding: '40px',
            minHeight: '100vh'
          }},
            h('div', { style: { maxWidth: '700px' }},
              h('p', { style: { color: '#E63946', fontWeight: 900, fontSize: '12px', textTransform: 'uppercase', letterSpacing: '3px' }},
                entry.getIn(['data', 'category']),
                ' • ',
                entry.getIn(['data', 'date']) ? new Date(entry.getIn(['data', 'date'])).getFullYear() : ''
              ),
              h('h1', { style: { fontSize: '48px', fontWeight: 900, textTransform: 'uppercase', lineHeight: 1, letterSpacing: '-2px', margin: '16px 0 32px' }},
                entry.getIn(['data', 'title'])
              ),
              imageUrl ? h('img', { src: this.props.getAsset(imageUrl).toString(), style: { width: '100%', filter: 'grayscale(1) brightness(0.9)', marginBottom: '32px' }}) : null,
              h('p', { style: { fontSize: '24px', fontWeight: 700, color: '#F4D35E', lineHeight: 1.3, marginBottom: '40px' }},
                entry.getIn(['data', 'excerpt'])
              ),
              h('div', { style: { fontSize: '18px', lineHeight: 1.7, color: '#ccc' }},
                this.props.widgetFor('body')
              )
            )
          );
        }
      });

      // Artwork Preview
      var ArtworkPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var imageUrl = entry.getIn(['data', 'imageUrl']);
          return h('div', { style: {
            fontFamily: 'Inter, sans-serif',
            backgroundColor: '#0a0a0a',
            color: '#fff',
            padding: '40px',
            display: 'flex',
            gap: '40px',
            minHeight: '100vh'
          }},
            h('div', { style: { flex: '0 0 300px' }},
              imageUrl ? h('img', { src: this.props.getAsset(imageUrl).toString(), style: { width: '100%', aspectRatio: '3/4', objectFit: 'cover', filter: 'grayscale(1)', border: '4px solid white' }}) : null
            ),
            h('div', { style: { flex: 1 }},
              h('span', { style: { backgroundColor: '#E63946', color: '#fff', padding: '4px 12px', fontWeight: 900, fontSize: '12px', textTransform: 'uppercase' }},
                entry.getIn(['data', 'category'])
              ),
              h('h1', { style: { fontSize: '56px', fontWeight: 900, textTransform: 'uppercase', lineHeight: 0.9, letterSpacing: '-2px', margin: '16px 0', fontStyle: 'italic' }},
                entry.getIn(['data', 'title'])
              ),
              entry.getIn(['data', 'description']) ? h('p', { style: { fontSize: '16px', color: '#999', marginTop: '24px' }}, entry.getIn(['data', 'description'])) : null,
              entry.getIn(['data', 'year']) ? h('p', { style: { fontSize: '14px', color: '#666', marginTop: '16px', textTransform: 'uppercase', fontWeight: 900 }}, 'Ano: ' + entry.getIn(['data', 'year'])) : null
            )
          );
        }
      });

      // Product Preview
      var ProductPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var imageUrl = entry.getIn(['data', 'imageUrl']);
          var price = entry.getIn(['data', 'price']);
          return h('div', { style: {
            fontFamily: 'Inter, sans-serif',
            backgroundColor: '#0a0a0a',
            color: '#fff',
            padding: '40px',
            minHeight: '100vh'
          }},
            h('div', { style: { display: 'flex', gap: '40px' }},
              h('div', { style: { flex: '0 0 350px' }},
                imageUrl ? h('img', { src: this.props.getAsset(imageUrl).toString(), style: { width: '100%', aspectRatio: '4/5', objectFit: 'cover', filter: 'grayscale(1) brightness(0.9)', border: '4px solid white' }}) : null
              ),
              h('div', { style: { flex: 1 }},
                h('h1', { style: { fontSize: '48px', fontWeight: 900, textTransform: 'uppercase', lineHeight: 1, letterSpacing: '-2px' }},
                  entry.getIn(['data', 'title'])
                ),
                h('p', { style: { fontSize: '40px', fontWeight: 900, color: '#E63946', margin: '16px 0 32px' }},
                  'R$ ' + (price ? Number(price).toFixed(2) : '0.00')
                ),
                h('div', { style: { fontSize: '16px', lineHeight: 1.6, color: '#ccc' }},
                  this.props.widgetFor('description')
                )
              )
            )
          );
        }
      });

      // Register preview templates
      CMS.registerPreviewTemplate('blog', BlogPreview);
      CMS.registerPreviewTemplate('artworks', ArtworkPreview);
      CMS.registerPreviewTemplate('products', ProductPreview);
    </script>
  </head>
  <body>
    <!-- Decap CMS will render inside this body -->
  </body>
</html>
